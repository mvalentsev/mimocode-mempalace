<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" aria-label="Flow: session.post writes a transcript, mempalace mine files it into the palace; chat.message triggers mempalace search, whose results are appended to the system prompt" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" viewBox="0 0 880 360"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7d8590" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><text x="48" y="52" fill="#7d8590" font-size="13"># every completed turn</text><rect width="140" height="40" x="48" y="78" fill="#191322" stroke="#6e5a96" rx="20"/><text x="118" y="103" fill="#c9b1fb" font-size="14" text-anchor="middle">session.post</text><line x1="192" x2="212" y1="98" y2="98" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/><rect width="210" height="56" x="218" y="70" fill="#161b22" stroke="#30363d" rx="10"/><text x="323" y="94" fill="#e6edf3" font-size="14.5" text-anchor="middle">transcript file</text><text x="323" y="114" fill="#8b949e" font-size="12" text-anchor="middle">question + final answer</text><line x1="432" x2="452" y1="98" y2="98" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/><rect width="214" height="56" x="458" y="70" fill="#161b22" stroke="#30363d" rx="10"/><text x="565" y="94" fill="#e6edf3" font-size="14.5" text-anchor="middle">mempalace mine</text><text x="565" y="114" fill="#8b949e" font-size="12" text-anchor="middle">debounced, serialized</text><line x1="676" x2="712" y1="98" y2="98" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/><path fill="#191322" stroke="#a371f7" stroke-width="1.5" d="M 718 88 A 70 14 0 0 1 858 88 V 238 A 70 14 0 0 1 718 238 Z"/><ellipse cx="788" cy="88" fill="#221a30" stroke="#a371f7" stroke-width="1.5" rx="70" ry="14"/><text x="788" y="156" fill="#c9b1fb" font-size="15" font-weight="700" text-anchor="middle">palace</text><text x="788" y="178" fi