<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Flow: session.post writes a transcript, mempalace mine files it into the palace; chat.message triggers mempalace search, whose results are appended to the system prompt" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- write side -->
  <text x="48" y="52" font-size="13" fill="#7d8590"># every completed turn</text>
  <rect x="48" y="78" width="140" height="40" rx="20" fill="#191322" stroke="#6e5a96"/>
  <text x="118" y="103" font-size="14" fill="#c9b1fb" text-anchor="middle">session.post</text>
  <line x1="192" y1="98" x2="212" y2="98" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="218" y="70" width="210" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="323" y="94" font-size="14.5" fill="#e6edf3" text-anchor="middle">transcript file</text>
  <text x="323" y="114" font-size="12" fill="#8b949e" text-anchor="middle">question + final answer</text>
  <line x1="432" y1="98" x2="452" y2="98" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="458" y="70" width="214" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="565" y="94" font-size="14.5" fill="#e6edf3" text-anchor="middle">mempalace mine</text>
  <text x="565" y="114" font-size="12" fill="#8b949e" text-anchor="middle">debounced, serialized</text>
  <line x1="676" y1="98" x2="712" y2="98" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- palace cylinder -->
  <path d="M 718 88 A 70 14 0 0 1 858 88 V 238 A 70 14 0 0 1 718 238 Z" fill="#191322" stroke="#a371f7" stroke-width="1.5"/>
  <ellipse cx="788" cy="88" rx="70" ry="14" fill="#221a30" stroke="#a371f7" stroke-width="1.5"/>
  <text x="788" y="156" font-size="15" font-weight="700" fill="#c9b1fb" text-anchor="middle">palace</text>
  <text x="788" y="178" font-size="12" fill="#8b949e" text-anchor="middle">wing per project</text>

  <!-- read side -->
  <text x="48" y="232" font-size="13" fill="#7d8590"># every new request</text>
  <rect x="48" y="258" width="140" height="40" rx="20" fill="#191322" stroke="#6e5a96"/>
  <text x="118" y="283" font-size="14" fill="#c9b1fb" text-anchor="middle">chat.message</text>
  <line x1="192" y1="278" x2="212" y2="278" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="218" y="250" width="210" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="323" y="274" font-size="14.5" fill="#e6edf3" text-anchor="middle">mempalace search</text>
  <text x="323" y="294" font-size="12" fill="#8b949e" text-anchor="middle">cached per query</text>
  <line x1="432" y1="278" x2="452" y2="278" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="458" y="250" width="230" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="573" y="274" font-size="13.5" fill="#e6edf3" text-anchor="middle"># Long-term memory</text>
  <text x="573" y="294" font-size="12" fill="#8b949e" text-anchor="middle">(MemPalace) &#8594; system prompt</text>

  <!-- palace to search elbow -->
  <path d="M 788 254 V 332 H 323 V 312" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
