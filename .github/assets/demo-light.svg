<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" aria-label="Demo: a fact mentioned once is recalled by meaning in a later session and answered from memory" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" viewBox="0 0 880 340"><defs><clipPath id="t2"><rect width="360" height="24" x="34" y="94"><animate attributeName="width" dur="16s" keyTimes="0;0.056;0.156;1" repeatCount="indefinite" values="0;0;360;360"/></rect></clipPath><clipPath id="t3"><rect width="480" height="24" x="34" y="120"><animate attributeName="width" dur="16s" keyTimes="0;0.156;0.231;1" repeatCount="indefinite" values="0;0;480;480"/></rect></clipPath><clipPath id="t7"><rect width="462" height="24" x="34" y="220"><animate attributeName="width" dur="16s" keyTimes="0;0.4;0.5;1" repeatCount="indefinite" values="0;0;462;462"/></rect></clipPath></defs><rect width="879" height="339" x=".5" y=".5" fill="#f6f8fa" stroke="#d0d7de" rx="12"/><line x1="1" x2="879" y1="40" y2="40" stroke="#d0d7de"/><circle cx="26" cy="20" r="6" fill="#ff5f57"/><circle cx="46" cy="20" r="6" fill="#febc2e"/><circle cx="66" cy="20" r="6" fill="#28c840"/><text x="440" y="25" fill="#6e7781" font-size="13" text-anchor="middle">mimo — with mimocode-mempalace</text><text x="856" y="25" fill="#8c959f" font-size="12" text-anchor="end">MemPalace 3.6.0</text><g font-size="15.5"><g opacity="1"><animate attributeName="opacity" dur="16s" keyTimes="0;0.969;1" repeatCount="indefinite" values="1;1;0"/><text x="36" y="78" fill="#6e7781" opacity="1"># session one — you mention a fact once <animate attributeName="opacity" dur="16s" keyTimes="0;0.019;0.044;1" repeatCount="indefinite" values="0;0;1;1"/></text><g clip-path="url(#t2)"><text x="36" y="110"><tspan fill="#8250df">❯</tspan><tspan fill="#1f2328"> the staging gateway listens on 8443,</tspan></text></g><g clip-path="url(#t3)"><text x="36" y="136" fill="#1f2328">it&apos;s set in deploy/gateway.toml under listen.port</text></g><text x="36" y="166" opacity="1"><tspan fill="#1a7f37">✓</tspan><tspan fill="#57606a"> captured — mine ok (wing: gateway)</tspan> <animate attributeName="opacity" dur="16s" keyTimes="0;0.256;0.281;1" repeatCount="indefinite" values="0;0;1;1"/></text><text x="36" y="206" fill="#6e7781" opacity="1"># a later session <animate attributeName="opacity" dur="16s" keyTimes="0;0.35;0.375;1" repeatCount="indefinite" values="0;0;1;1"/></text><g clip-path="url(#t7)"><text x="36" y="236"><tspan fill="#8250df">❯</tspan><tspan fill="#1f2328"> which port does the staging gateway listen on?</tspan></text></g><text x="36" y="264" fill="#57606a" opacity="1">↳ search hit → &quot;# Long-term memory (MemPalace)&quot; → system prompt <animate attributeName="opacity" dur="16s" keyTimes="0;0.525;0.55;1" repeatCount="indefinite" values="0;0;1;1"/></text><text x="36" y="298" opacity="1"><tspan fill="#8250df" font-weight="700">8443</tspan><tspan fill="#1f2328"> — set in deploy/gateway.toml under listen.port.</tspan> <animate attributeName="opacity" dur="16s" keyTimes="0;0.5875;0.619;1" repeatCount="indefinite" values="0;0;1;1"/></text></g></g></svg>