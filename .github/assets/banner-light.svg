<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="mimocode-mempalace: long-term memory for MiMoCode, backed by MemPalace" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.2" fill="#eef1f4"/>
    </pattern>
    <radialGradient id="glowText" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowHub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="#ffffff"/>
  <g clip-path="url(#panel)">
    <rect x="1" y="1" width="1198" height="298" fill="url(#grid)"/>
    <ellipse cx="330" cy="140" rx="420" ry="170" fill="url(#glowText)"/>
    <ellipse cx="1030" cy="160" rx="260" ry="180" fill="url(#glowHub)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- memory constellation -->
  <g stroke="#d8dee4" stroke-width="1.5" fill="none">
    <line x1="912" y1="72" x2="1006" y2="52"/>
    <line x1="1006" y1="52" x2="1094" y2="88"/>
    <line x1="1094" y1="88" x2="1160" y2="60"/>
    <line x1="912" y1="72" x2="938" y2="150"/>
    <line x1="938" y1="150" x2="1030" y2="160"/>
    <line x1="1094" y1="88" x2="1030" y2="160"/>
    <line x1="938" y1="150" x2="962" y2="232"/>
    <line x1="962" y1="232" x2="1030" y2="160"/>
    <line x1="1030" y1="160" x2="1118" y2="212"/>
    <line x1="1118" y1="212" x2="1162" y2="158"/>
    <line x1="1030" y1="160" x2="1162" y2="158"/>
    <line x1="962" y1="232" x2="1064" y2="256"/>
    <line x1="1064" y1="256" x2="1118" y2="212"/>
  </g>
  <line x1="938" y1="150" x2="1030" y2="160" stroke="#8250df" stroke-width="1.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/>
  </line>
  <g fill="#c8b6ec">
    <circle cx="912" cy="72" r="4"/>
    <circle cx="1006" cy="52" r="4"/>
    <circle cx="1094" cy="88" r="4.5"/>
    <circle cx="1160" cy="60" r="3.5"/>
    <circle cx="938" cy="150" r="5"/>
    <circle cx="962" cy="232" r="4.5"/>
    <circle cx="1118" cy="212" r="4"/>
    <circle cx="1162" cy="158" r="3.5"/>
    <circle cx="1064" cy="256" r="3.5"/>
  </g>
  <circle cx="938" cy="150" r="5" fill="#a883e8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1094" cy="88" r="4.5" fill="#a883e8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" begin="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="160" r="8" fill="#8250df">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#6e40c9" opacity="0.9">
    <animateMotion path="M 938 150 L 1030 160" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- wordmark -->
  <text x="72" y="146" font-size="58" font-weight="700">
    <tspan fill="#1f2328">mimocode</tspan><tspan fill="#6e7781">-</tspan><tspan fill="#8250df">mempalace</tspan>
  </text>
  <text x="74" y="196" font-size="22" fill="#57606a">Long-term memory for MiMoCode, backed by MemPalace</text>

  <!-- feature chips -->
  <g font-size="14.5">
    <rect x="72" y="222" width="310" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="94" cy="239" r="3.5" fill="#8250df"/>
    <text x="108" y="244" fill="#57606a">every completed turn captured</text>
    <rect x="394" y="222" width="210" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="416" cy="239" r="3.5" fill="#8250df"/>
    <text x="430" y="244" fill="#57606a">recalled by meaning</text>
    <rect x="616" y="222" width="320" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="638" cy="239" r="3.5" fill="#8250df"/>
    <text x="652" y="244" fill="#57606a">injected into the system prompt</text>
  </g>
</svg>
